<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DEA · Diagnostic Elvis Agent</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="dea-icon.png">
  <script>
    // apply the saved theme before the first paint (no flash of the wrong theme)
    var t = "dark"; try { if (JSON.parse(localStorage.getItem("dea.theme")) === "light") t = "light"; } catch (e) {}
    document.documentElement.dataset.theme = t;
  </script>
</head>
<body>
  <dea-root></dea-root>
</body>
</html>
