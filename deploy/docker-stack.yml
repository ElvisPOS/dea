# Deploy on the server (Docker Swarm):
#   docker stack deploy -c docker-stack.yml rterm
# Secrets/settings live in rterm.env next to this file (see rterm.env.example).
version: "3.8"

services:
  server:
    image: rterm-server:${RTERM_VERSION:-latest}
    hostname: "{{.Node.Hostname}}"
    env_file: rterm.env
    ports:
      # host mode keeps the real client IP in the audit log (the swarm ingress mesh would hide it)
      - target: 7681
        published: 7681
        protocol: tcp
        mode: host
    volumes:
      - rterm-data:/data
    networks:
      - rterm
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  rterm-data:

networks:
  rterm:
    driver: overlay
